name: chatapp

services:
  backend-ws:
    container_name: ws
    build:
      context: ./backend/python_ws_server
    ports:
      - "8765:8765"
    volumes:
      - "./backend:/app"
    depends_on:
      - db

  backend-api:
    container_name: api
    build:
      context: ./backend/python_api
    ports:
      - "8000:8000"
    volumes:
      - "./backend:/app"
    depends_on:
      - db

  frontend:
    container_name: frontend
    build:
      context: ./frontend
    ports:
      - "3000:5173"
    volumes:
      - "./frontend:/app"
    depends_on:
      - backend-ws
      - backend-api

  adminer:
    container_name: adminer
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    container_name: db
    image: postgres:17
    shm_size: 128mb
    environment:
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: chatpass
      POSTGRES_DB: chatapp
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
