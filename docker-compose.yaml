name: chatapp

services:
  backend:
    container_name: chat-backend
    build:
      context: ./python-ws-server
    ports:
      - "8765:8765"
    volumes:
      - "./python-ws-server:/app"

  frontend:
    container_name: chat-frontend
    build:
      context: ./chat-frontend
    ports:
      - "3000:5173"
    volumes:
      - "./chat-frontend:/app"